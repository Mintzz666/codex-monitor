name: CodexMonitorMobile

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    APP_GROUP_IDENTIFIER: group.com.example.codexmonitor.mobile
    CURRENT_PROJECT_VERSION: 2
    DEVELOPMENT_LANGUAGE: zh-Hans
    MARKETING_VERSION: 1.2.0
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"

targets:
  CodexMonitorMobile:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/App
      - path: ../Resources/AppIcon/AppIcon-1024.png
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Resources/CodexMonitorMobile.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Codex Monitor
        INFOPLIST_KEY_CodexMonitorKeychainGroup: $(AppIdentifierPrefix)com.example.codexmonitor.mobile.shared
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.codexmonitor.mobile
        PRODUCT_NAME: Codex Monitor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: CodexMonitorMobileWidget
        embed: true

  CodexMonitorMobileWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/Widget
      - path: ../Resources/AppIcon/AppIcon-1024.png
        buildPhase: resources
    info:
      path: Resources/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Codex Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Resources/CodexMonitorMobileWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.example.codexmonitor.mobile.widget
        PRODUCT_NAME: CodexMonitorMobileWidget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  CodexMonitorMobile:
    build:
      targets:
        CodexMonitorMobile: all
        CodexMonitorMobileWidget: all
    run:
      config: Debug
    archive:
      config: Release
