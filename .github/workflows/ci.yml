name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read package version
        run: |
          source Scripts/version.sh
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Public release privacy check
        run: make public-release-check

      - name: Generate macOS Xcode project
        run: |
          make xcode-project

      - name: Check Swift formatting
        run: swift format lint --recursive Sources Tests Package.swift

      - name: Run deterministic verifier
        run: make test

      - name: Verify Badge and release file selection
        run: make badge-test

      - name: Build macOS widget
        run: make widget-build

      - name: Package local macOS app and DMG
        run: make release-package

      - name: Verify artifacts
        run: python3 Scripts/verify_release_artifact.py
