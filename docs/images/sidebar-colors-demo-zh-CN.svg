<text x="48" y="111" font-size="38" fill="#182634" font-weight="700">让项目颜色延伸到每个会话</text>
<text x="48" y="148" font-size="19" fill="#617185" font-weight="400">文件夹颜色继承 · 五级 Token 色阶 · Recent 会话匹配</text>
<rect x="48" y="184" width="516" height="746" rx="22" fill="#fafafa" stroke="#dce3ea"/>
