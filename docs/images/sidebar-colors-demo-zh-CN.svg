<text x="604" y="226" font-size="15" fill="#2674bf" font-weight="700">01</text>
<text x="646" y="226" font-size="25" fill="#182634" font-weight="650">按项目选择颜色</text>
<text x="604" y="264" font-size="18" fill="#617185" font-weight="400">7 种颜色，区分不同工作空间。</text>
<circle cx="620" cy="307" r="17" fill="#cf4b43"/>
<circle cx="689" cy="307" r="17" fill="#b76c10"/>
<circle cx="758" cy="307" r="17" fill="#92700b"/>
<circle cx="827" cy="307" r="17" fill="#268347"/>
<circle cx="896" cy="307" r="17" fill="#2674bf"/>
<circle cx="965" cy="307" r="17" fill="#9950c0"/>
<circle cx="1034" cy="307" r="17" fill="#717980"/>
<text x="604" y="380" font-size="15" fill="#268347" font-weight="700">02</text>
<text x="646" y="380" font-size="25" fill="#182634" font-weight="650">会话继承文件夹颜色</text>
<text x="604" y="418" font-size="18" fill="#617185" font-weight="400">同一项目保持相同色系，减少辨认成本。</text>
<text x="604" y="484" font-size="20" fill="#30363c" font-weight="600">五级深浅，表示累计 Token 区间</text>
<rect x="604" y="513" width="82" height="53" rx="10" fill="#d8e9de" stroke="none"/>
<rect x="705" y="513" width="82" height="53" rx="10" fill="#b5d5c0" stroke="none"/>
<rect x="806" y="513" width="82" height="53" rx="10" fill="#8abc9c" stroke="none"/>
<rect x="907" y="513" width="82" height="53" rx="10" fill="#569e6f" stroke="none"/>
<rect x="1008" y="513" width="82" height="53" rx="10" fill="#268347" stroke="none"/>
<text x="604" y="598" font-size="16" fill="#617185" font-weight="400">较少</text>
<text x="1027" y="598" font-size="16" fill="#617185" font-weight="400">较多</text>
<path d="M686 592H1008m-7-5 7 5-7 5" fill="none" stroke="#a8b4bf" stroke-width="1.5"/>
<text x="604" y="676" font-size="15" fill="#9950c0" font-weight="700">03</text>
<text x="646" y="676" font-size="25" fill="#182634" font-weight="650">Recent 中也能辨认项目</text>
<text x="604" y="714" font-size="18" fill="#617185" font-weight="400">明确匹配的会话沿用项目颜色；</text>
<text x="604" y="746" font-size="18" fill="#617185" font-weight="400">未匹配的条目保留中性色标记。</text>
<rect x="604" y="790" width="500" height="89" rx="13" fill="#e9eef4" stroke="none"/>
<text x="626" y="824" font-size="18" fill="#405269" font-weight="650">虚构内容 · 界面示意</text>
<text x="626" y="854" font-size="16" fill="#617185" font-weight="400">无真实会话、路径、账号或用量。</text>
<rect x="84" y="901" width="16" height="16" rx="4" fill="#d6dce2"/><text x="116" y="916" font-size="19" fill="#687480">新会话</text>
<text x="48" y="968" font-size="16" fill="#617185" font-weight="400">根据当前颜色规则绘制，非用户界面截图。</text>
</g></svg>
