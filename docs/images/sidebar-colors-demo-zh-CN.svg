<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">侧边栏项目颜色与 Token 色阶演示</title>
<desc id="desc">所有项目名、会话名均为虚构。根据当前颜色规则绘制的界面示意，不含用户截图或数据。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="1200" height="1000" rx="0" fill="#f1f5f9" stroke="none"/>
