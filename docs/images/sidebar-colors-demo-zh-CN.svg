<rect x="130" y="390" width="16" height="16" rx="4" fill="#b5d5c0" stroke="none"/>
<text x="162" y="405" font-size="19" fill="#454d55" font-weight="400">界面草图</text>
<rect x="130" y="426" width="16" height="16" rx="4" fill="#569e6f" stroke="none"/>
<text x="162" y="441" font-size="19" fill="#454d55" font-weight="400">组件整理</text>
<path d="M84 478V474a3 3 0 0 1 3-3h8l5 5h12a3 3 0 0 1 3 3l-4 15H86a3 3 0 0 1-3-3V478h32" fill="none" stroke="#cf4b43" stroke-width="2" stroke-linejoin="round"/>
