<text x="162" y="562" font-size="19" fill="#454d55" font-weight="400">学习计划</text>
<path d="M84 599V595a3 3 0 0 1 3-3h8l5 5h12a3 3 0 0 1 3 3l-4 15H86a3 3 0 0 1-3-3V599h32" fill="none" stroke="#b76c10" stroke-width="2" stroke-linejoin="round"/>
<text x="130" y="611" font-size="23" fill="#30363c" font-weight="550">创意实验室</text>
<rect x="130" y="632" width="16" height="16" rx="4" fill="#e7cdae" stroke="none"/>
<text x="162" y="647" font-size="19" fill="#454d55" font-weight="400">配色探索</text>
<rect x="130" y="668" width="16" height="16" rx="4" fill="#c78c45" stroke="none"/>
<text x="162" y="683" font-size="19" fill="#454d55" font-weight="400">图标练习</text>
<path d="M84 720V716a3 3 0 0 1 3-3h8l5 5h12a3 3 0 0 1 3 3l-4 15H86a3 3 0 0 1-3-3V720h32" fill="none" stroke="#2674bf" stroke-width="2" stroke-linejoin="round"/>
<text x="130" y="732" font-size="23" fill="#30363c" font-weight="550">示例应用</text>
<rect x="130" y="753" width="16" height="16" rx="4" fill="#5693cd" stroke="none"/>
<text x="162" y="768" font-size="19" fill="#454d55" font-weight="400">欢迎页面</text>
